<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GBAdhoc XMB</title>
<link rel="stylesheet" href="brand.css">

<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="win" id="win" data-theme="dark">
  <div id="banners"></div>
  <div class="body">

      <div class="logo"><i></i><span class="xmb">XMB</span></div>
      <div class="dev" id="dev"></div>
      <nav class="nav" id="nav"></nav>
      <div class="foot"><span id="ver">GBAdhoc XMB 0.1.0-beta.2</span><span class="theme" id="theme" role="group" aria-label="Theme"><button class="on" data-t="dark">Dark</button><button data-t="light">Light</button></span></div>
    </aside>
    <section class="main" id="main"></section>
  </div>
  <div class="statusbar" id="statusbar"></div>
  <div class="drawer" id="drawer"></div>
  <div class="toasts" id="toasts"></div>

<script src="bridge.js"></script>
<script src="model.js"></script>
<script src="desktop.js"></script>

</html>
